# Bible Gematria Interlinear Explorer — single public entrypoint.
#
# Mounted at /etc/nginx/conf.d/default.conf, i.e. inside the stock nginx http{}
# block, so the gzip_* directives below are valid here.
#
# Upstreams are Docker service names on the `bible-net` bridge network.
# Every chatbot call goes through flask-api (its internal /api/bible-chat/*
# proxy) — nginx never talks to the chatbot container directly.

upstream flask_api {
    server flask-api:5000;
    keepalive 16;
}

# gzip for text payloads. NOT for /LC_/ (JPEGs are already compressed) — handled
# by simply not listing image/jpeg here plus `gzip off` in that location.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml;

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # ---- TLS (add later; not built out in this pass) --------------------------
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # Also: publish 443 in docker-compose.yml and mount the cert volume.
    # -------------------------------------------------------------------------

    # Easy to tail on the VM:  docker compose exec nginx tail -f /var/log/nginx/bible.access.log
    # (bind-mounted to ./nginx/logs/ on the host)
    access_log /var/log/nginx/bible.access.log;
    error_log  /var/log/nginx/bible.error.log warn;

    client_max_body_size 12m;

    # SPA document root (bind-mounted ./frontend/dist, read-only)
    root  /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # 1. Leningrad Codex manuscript scans — static, versionless JPEGs.
    #    `alias` (not proxy_pass) straight to the mounted image directory.
    #    Keep the trailing slash on both the location and the alias.
    # ------------------------------------------------------------------------
    location /LC_/ {
        alias /srv/LC_/;
        try_files $uri =404;

        gzip off;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------------
    # 2. Chat STREAMING endpoint (SSE).
    #    Frontend: POST `${'/api/bible-chat'}/chat/stream`  (fetch + ReadableStream,
    #    media_type text/event-stream). Flask forwards subpath `chat/stream` to
    #    the chatbot's POST /chat/stream. Must NOT be buffered anywhere.
    #    Exact match so it wins over the /api/ prefix below.
    # ------------------------------------------------------------------------
    location = /api/bible-chat/chat/stream {
        proxy_pass http://flask_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering        off;
        proxy_request_buffering off;
        proxy_cache            off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # The app's stated requirement: no enforced timeout under ~180s on this
        # path. Give it a wide margin (LLM answers can run to ~180s).
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ------------------------------------------------------------------------
    # 3. Everything else under /api/ — JSON API AND the rest of the
    #    /api/bible-chat/* proxy (non-streaming chat, /verse, /study,
    #    /parables, /study-wikis, ...). Non-streaming LLM calls can also run
    #    long, so keep a generous read timeout (Flask's own proxy waits 180s).
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://flask_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;
    }

    # ------------------------------------------------------------------------
    # 4. Server-rendered HTML pages (jQuery frontend, cookie toggles).
    #    Anchored regex so only these four exact paths hit Flask here.
    # ------------------------------------------------------------------------
    location ~ ^/(explorer|strongs|gematria|english)$ {
        proxy_pass http://flask_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------------
    # 5. Flask's own static assets. static_url_path is the default '/static'
    #    (confirmed: myproject.py does Flask(__name__) with no override, and
    #    page_head links /static/style-v1.1.css). Served by Flask; cache hard.
    # ------------------------------------------------------------------------
    location /static/ {
        proxy_pass http://flask_api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------------------
    # 6. Everything else → the SPA. try_files so client-side routes don't 404.
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
