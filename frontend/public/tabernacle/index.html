<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Tabernacle of Moses</title>
  <meta name="description" content="A walk through the tabernacle of Moses, from the drawn pattern to the Holy of Holies, built from the measurements in Exodus.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>

  <div class="ui">
    <header class="mark">
      <p class="mark-title">The Tabernacle</p>
      <p class="mark-sub">From the pattern to the presence</p>
    </header>

    <nav class="stations" aria-label="Stations of the walk">
      <ol>
        <li>The pattern</li>
        <li>The gate</li>
        <li>Altar of burnt offering</li>
        <li>The laver</li>
        <li>Door of the tent</li>
        <li>Holy Place</li>
        <li>The veil</li>
        <li>Holy of Holies</li>
      </ol>
    </nav>

    <figure class="note" data-from="0" data-to="1.0">
      <figcaption class="ref">Exodus 25:9</figcaption>
      <blockquote>According to all that I shew thee, after the pattern of the tabernacle&hellip; even so shall ye make it.</blockquote>
    </figure>
    <figure class="note" data-from="1.5" data-to="3.1">
      <figcaption class="ref">Exodus 26:30</figcaption>
      <blockquote>And thou shalt rear up the tabernacle according to the fashion thereof which was shewed thee in the mount.</blockquote>
    </figure>
    <figure class="note" data-from="3.5" data-to="5.0">
      <figcaption class="ref">Exodus 27:18</figcaption>
      <blockquote>The length of the court shall be an hundred cubits, and the breadth fifty every where, and the height five cubits of fine twined linen.</blockquote>
      <p class="dim">52 × 26 m · hangings 2.6 m high</p>
    </figure>
    <figure class="note" data-from="5.6" data-to="7.3">
      <figcaption class="ref">Exodus 27:16</figcaption>
      <blockquote>And for the gate of the court shall be an hanging of twenty cubits, of blue, and purple, and scarlet, and fine twined linen, wrought with needlework.</blockquote>
      <p class="dim">Gate 20 cubits · 10.4 m wide</p>
    </figure>
    <figure class="note" data-from="8.9" data-to="10.9">
      <figcaption class="ref">Psalm 100:4</figcaption>
      <blockquote>Enter into his gates with thanksgiving, and into his courts with praise.</blockquote>
      <p class="dim">The outer court · ahead, the altar of burnt offering</p>
    </figure>

    <figure class="note" data-from="12.8" data-to="14.0">
      <figcaption class="ref">Leviticus 6:13</figcaption>
      <blockquote>The fire shall ever be burning upon the altar; it shall never go out.</blockquote>
      <p class="dim">Altar of burnt offering · 5 × 5 × 3 cubits · acacia overlaid with brass</p>
    </figure>
    <figure class="note" data-from="15.4" data-to="16.6">
      <figcaption class="ref">Exodus 30:18–19</figcaption>
      <blockquote>Thou shalt also make a laver of brass, and his foot also of brass, to wash withal&hellip; for Aaron and his sons shall wash their hands and their feet thereat.</blockquote>
      <p class="dim">The laver · made of the women&rsquo;s looking-glasses (Ex 38:8)</p>
    </figure>
    <figure class="note" data-from="17.1" data-to="18.3">
      <figcaption class="ref">Exodus 26:36</figcaption>
      <blockquote>And thou shalt make an hanging for the door of the tent, of blue, and purple, and scarlet, and fine twined linen, wrought with needlework.</blockquote>
      <p class="dim">The door · five pillars of acacia overlaid with gold</p>
    </figure>
    <figure class="note" data-from="19.6" data-to="20.9">
      <figcaption class="ref">Exodus 40:24–25</figcaption>
      <blockquote>And he put the candlestick in the tent of the congregation, over against the table&hellip; And he lighted the lamps before the LORD.</blockquote>
      <p class="dim">The Holy Place · 20 × 10 × 10 cubits · 10.4 × 5.2 × 5.2 m</p>
    </figure>
    <figure class="note" data-from="21.3" data-to="22.5">
      <figcaption class="ref">Exodus 25:30</figcaption>
      <blockquote>And thou shalt set upon the table shewbread before me alway.</blockquote>
      <p class="dim">Table · 2 × 1 × 1½ cubits · twelve loaves in two rows (Lev 24:6)</p>
    </figure>
    <figure class="note" data-from="23.0" data-to="24.2">
      <figcaption class="ref">Exodus 25:31, 37</figcaption>
      <blockquote>And thou shalt make a candlestick of pure gold&hellip; and they shall light the lamps thereof, that they may give light over against it.</blockquote>
      <p class="dim">Candlestick · a talent of pure gold · seven lamps</p>
    </figure>
    <figure class="note" data-from="24.7" data-to="25.9">
      <figcaption class="ref">Exodus 30:7–8</figcaption>
      <blockquote>And Aaron shall burn thereon sweet incense every morning&hellip; a perpetual incense before the LORD throughout your generations.</blockquote>
      <p class="dim">Altar of incense · 1 × 1 × 2 cubits · overlaid with pure gold</p>
    </figure>
    <figure class="note" data-from="26.1" data-to="27.4">
      <figcaption class="ref">Exodus 26:31, 33</figcaption>
      <blockquote>And thou shalt make a vail of blue, and purple, and scarlet, and fine twined linen of cunning work: with cherubims shall it be made&hellip; and the vail shall divide unto you between the holy place and the most holy.</blockquote>
    </figure>
    <figure class="note" data-from="28.6" data-to="30.3">
      <figcaption class="ref">Exodus 25:22</figcaption>
      <blockquote>And there I will meet with thee, and I will commune with thee from above the mercy seat, from between the two cherubims which are upon the ark of the testimony.</blockquote>
      <p class="dim">Holy of Holies · 10 × 10 × 10 cubits · the ark 2½ × 1½ × 1½</p>
    </figure>
    <figure class="note" data-from="32.6" data-to="99">
      <figcaption class="ref">Exodus 40:33–34</figcaption>
      <blockquote>So Moses finished the work. Then a cloud covered the tent of the congregation, and the glory of the LORD filled the tabernacle.</blockquote>
    </figure>

    <p class="hint">Scroll to raise the walls</p>

    <!-- things in the model that can be clicked while looking around; data-pos is the point in metres (x, y, z) -->
    <div class="spots">
      <button type="button" class="spot" data-spot="boards" data-pos="-6.63,2.3,-2.585">
        <span class="spot-label">The boards</span>
      </button>
      <button type="button" class="spot" data-spot="table" data-pos="-5.2,1.2,-1.56">
        <span class="spot-label">The table of showbread</span>
      </button>
      <button type="button" class="spot" data-spot="menorah" data-pos="-5.2,1.8,1.56">
        <span class="spot-label">The menorah</span>
      </button>
      <button type="button" class="spot" data-spot="incense" data-pos="-9.2,1.55,0">
        <span class="spot-label">The altar of incense</span>
      </button>
      <button type="button" class="spot" data-spot="ark" data-pos="-13,1.65,0">
        <span class="spot-label">The ark of the covenant</span>
      </button>
      <button type="button" class="spot" data-spot="laver" data-pos="6.5,1.35,0">
        <span class="spot-label">The bronze laver</span>
      </button>
      <button type="button" class="spot" data-spot="altar" data-pos="13,1.7,-0.9">
        <span class="spot-label">The altar of burnt offering</span>
      </button>
      <button type="button" class="spot" data-spot="gate" data-pos="26.2,1.7,1.7">
        <span class="spot-label">The gate of the court</span>
      </button>
      <button type="button" class="spot" data-spot="door" data-pos="0.25,2.5,0.65">
        <span class="spot-label">The door of the tent</span>
      </button>
      <button type="button" class="spot" data-spot="veil" data-pos="-10.25,2.5,1.0">
        <span class="spot-label">The veil</span>
      </button>
    </div>

    <aside class="info" role="dialog" data-lenis-prevent aria-labelledby="info-title" hidden>
      <button type="button" class="info-close" aria-label="Close">&times;</button>
      <div class="info-body"></div>
    </aside>










    <div class="look" role="group" aria-label="Look around">
      <p class="look-how"><span class="look-mouse">Drag to look around · scroll to walk on</span><span class="look-touch">Drag to look around</span></p>
      <button type="button" class="look-next">Walk on</button>
    </div>
  </div>

  <main id="track" aria-label="Scroll to walk through the tabernacle"></main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
